name: v15-workspace-review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.js'
      - '**.css'
      - 'index.html'
      - 'scripts/**'
      - 'sources/**'
      - 'tests/**'
      - '.github/workflows/v15-workspace-review.yml'
permissions:
  contents: write
concurrency:
  group: v15-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.13.4 playwright pycryptodome==3.23.0
      - name: Install CJK fonts for visual regression
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Finalize reviewed draft changes
        run: |
          if test -f scripts/finalize_workspace_review.py; then python scripts/finalize_workspace_review.py; fi
      - name: Syntax and unit regressions
        run: |
          node --check workspace-core-v15.js
          node --check workspace-v15.js
          node --check config.js
          node --check enhancements-v12-security.js
          node tests/account_vault.mjs
          node tests/account_vault_security.mjs
          node tests/v14_score_calibration.mjs
          PYTHONPATH=. python -m unittest -v tests.test_workspace_v15 tests.test_user_target_overlay tests.test_recruit_domain_expander
      - name: Real browser UI and encrypted-account preservation
        run: PYTHONPATH=. python tests/workspace_v15_smoke.py
      - name: Legacy browser and outage regressions
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/pto-v15-legacy.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 1
          python tests/browser_smoke.py
          python tests/theme_smoke.py
          python tests/large_catalog_smoke.py
          python tests/v14_source_resilience_smoke.py
          python tests/v141_feed_recovery_smoke.py
          python tests/v14_pipeline_timeline_smoke.py
          python tests/v12_security_browser_smoke.py
      - name: Observe expanded official sources with precision checks
        if: ${{ hashFiles('scripts/finalize_workspace_review.py') != '' }}
        env:
          PTO_V15_FULL: '1'
        run: PYTHONPATH=. python scripts/workspace_source_refresh.py
      - name: Review snapshot (public app files only)
        if: always()
        run: PYTHONPATH=. python tests/v15_review_snapshot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pto-v15-review
          path: /tmp/pto-v15-review/
          retention-days: 5
      - name: Commit tested finalization on the authorized draft branch
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'upgrade/v1.5-neutral-workspace' && hashFiles('scripts/finalize_workspace_review.py') != '' }}
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'path-to-offer-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/finalize_workspace_review.py
          git add workspace-core-v15.js workspace-v15.js workspace-v15.css ranking-v14.js README.md scripts/workspace_source_refresh.py tests/ data/jobs_supplemental.json data/supplemental_source_status.json
          git commit -m 'fix: finalize verified workspace UX and reject source false positives'
          git push origin "HEAD:$BRANCH"
