name: v15-workspace-review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.js'
      - '**.css'
      - 'index.html'
      - 'scripts/**'
      - 'sources/**'
      - 'tests/**'
      - '.github/workflows/v15-workspace-review.yml'
permissions:
  contents: write
concurrency:
  group: v15-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.13.4 playwright pycryptodome==3.23.0
      - name: Install CJK fonts for visual regression
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Assemble compatible changes on this draft PR only
        run: |
          if test -f scripts/apply_workspace_upgrade.py; then python scripts/apply_workspace_upgrade.py; fi
          if test -f scripts/apply_workspace_polish.py; then python scripts/apply_workspace_polish.py; fi
      - name: Syntax and unit regressions
        run: |
          node --check workspace-core-v15.js
          node --check workspace-v15.js
          node --check config.js
          node --check enhancements-v12-security.js
          node tests/account_vault.mjs
          node tests/account_vault_security.mjs
          PYTHONPATH=. python -m unittest -v tests.test_workspace_v15 tests.test_user_target_overlay tests.test_recruit_domain_expander
      - name: Real browser UI and encrypted-account preservation
        run: PYTHONPATH=. python tests/workspace_v15_smoke.py
      - name: Observe expanded official sources
        if: ${{ hashFiles('scripts/apply_workspace_upgrade.py') != '' }}
        env:
          PTO_V15_FULL: '1'
        run: PYTHONPATH=. python scripts/workspace_source_refresh.py
      - name: Review snapshot (public app files only)
        if: always()
        run: PYTHONPATH=. python tests/v15_review_snapshot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pto-v15-review
          path: /tmp/pto-v15-review/
          retention-days: 5
      - name: Commit tested assembly on the authorized draft branch
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'upgrade/v1.5-neutral-workspace' && hashFiles('scripts/apply_workspace_upgrade.py') != '' }}
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'path-to-offer-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_workspace_upgrade.py scripts/apply_workspace_polish.py
          git add config.js index.html enhancements-v12-security.js workspace-core-v15.js workspace-v15.js workspace-v15.css scripts/official_source_graph.py scripts/recruit_domain_expander.py scripts/recruit_domain_sweep.py scripts/user_target_overlay.py sources/user_target_positions_20260903.json tests/theme_smoke.py tests/workspace_v15_smoke.py data/jobs_supplemental.json data/supplemental_source_status.json
          git commit -m 'feat: assemble tested v1.5 workspace and observed employer feed'
          git push origin "HEAD:$BRANCH"
