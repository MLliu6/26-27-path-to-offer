name: refresh-recruit-domain-sweep

on:
  workflow_dispatch:
  schedule:
    - cron: '20 1-23/2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/recruit_domain_expander.py'
      - 'scripts/recruit_domain_sweep.py'
      - 'scripts/kuaishou_public_api_harvester.py'
      - 'sources/recruit_domain_overrides.json'
      - '.github/workflows/refresh-recruit-domain-sweep.yml'
  pull_request:
    paths:
      - 'scripts/recruit_domain_expander.py'
      - 'scripts/recruit_domain_sweep.py'
      - 'scripts/kuaishou_public_api_harvester.py'
      - 'sources/recruit_domain_overrides.json'
      - 'tests/test_recruit_domain_expander.py'
      - 'tests/test_recruit_domain_detail_links.py'
      - 'tests/test_kuaishou_public_api_harvester.py'
      - 'tests/kuaishou_public_api_probe.py'
      - '.github/workflows/refresh-recruit-domain-sweep.yml'

permissions:
  contents: write

concurrency:
  group: recruit-domain-sweep-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      PTO_RECRUIT_SWEEP_MAX_TARGETS: '32'
      PTO_RECRUIT_SWEEP_TIMEOUT_MS: '14000'
      PTO_PRIORITY_BROWSER_JD_CHARS: '1800'
      PTO_KUAISHOU_MAX_PAGES: '180'
      PTO_KUAISHOU_PAGE_TIMEOUT_MS: '9000'
      PTO_MAX_CATALOG: '60000'
      PTO_MAX_CN_CATALOG: '30000'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.4 playwright pycryptodome==3.23.0

      - name: Expand previous compact feed
        run: PYTHONPATH=. python scripts/expand_feed.py

      - name: Build baseline official source graph
        run: PYTHONPATH=. python scripts/official_source_graph.py

      - name: Expand all recruitment-style official domains
        run: PYTHONPATH=. python scripts/recruit_domain_expander.py

      - name: Unit-test recruitment-domain discovery, sharding and detail links
        run: PYTHONPATH=. python -m unittest -v tests.test_recruit_domain_expander tests.test_recruit_domain_detail_links tests.test_kuaishou_public_api_harvester

      - name: Probe Kuaishou public recruitment routes
        if: ${{ github.event_name == 'pull_request' }}
        run: PYTHONPATH=. python tests/kuaishou_public_api_probe.py

      - name: Sweep one bounded real-browser/API shard
        env:
          PTO_RECRUIT_SWEEP_FORCE_COMPANIES: ${{ github.event_name != 'schedule' && '快手,京东' || '' }}
          PTO_RECRUIT_SWEEP_MAX_TARGETS: ${{ github.event_name == 'pull_request' && '2' || github.event_name == 'push' && '4' || '32' }}
          PTO_RECRUIT_SWEEP_SHARD_INDEX: ${{ github.event_name == 'pull_request' && '0' || '' }}
        run: PYTHONPATH=. python scripts/recruit_domain_sweep.py

      - name: Validate reviewed Kuaishou jobs before compaction
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/jobs.json').read_text(encoding='utf-8'))
          status=json.loads(Path('data/source_status.json').read_text(encoding='utf-8'))
          overrides=json.loads(Path('sources/recruit_domain_overrides.json').read_text(encoding='utf-8'))
          jobs=[j for j in payload.get('jobs',[]) if isinstance(j,dict)]
          groups={x.get('name'):x for x in status.get('sources',[]) if isinstance(x,dict)}
          sweep=groups.get('recruit-domain-sweep') or {}
          diag=sweep.get('diagnostics') or {}
          selected_ids={str(x.get('id') or '') for x in diag.get('selected',[]) if isinstance(x,dict)}
          specs={
              'recruit-kuaishou-campus-2027': (250,'2027校园招聘','official-public-api','official-public-api','/campus/job-info/'),
              'recruit-kuaishou-intern-2027': (200,'2027留用实习招聘','official-public-api','official-public-api','/campus/job-info/'),
              'recruit-kuaishou-social': (1000,'社会招聘','official-browser-ui-xhr','browser-ui-navigation+xhr-observation','/official/social/job-info/'),
              'recruit-kuaishou-trainee': (900,'日常实习','official-browser-ui-xhr','browser-ui-navigation+xhr-observation','/official/trainee/job-info/'),
          }
          assert set(specs).issubset(selected_ids), selected_ids
          source_diag={x.get('id'):x for x in diag.get('sources',[]) if isinstance(x,dict)}
          total=0
          for source_id,(minimum,batch,observed,transport,path_fragment) in specs.items():
              src='direct-official:browser:'+source_id
              rows=[j for j in jobs if j.get('source')==src and str(j.get('position_id') or '').strip()]
              assert len(rows)>=minimum, (source_id,len(rows))
              assert all(j.get('batch')==batch for j in rows), (source_id,{j.get('batch') for j in rows[:30]})
              assert all(j.get('observed_via')==observed for j in rows), source_id
              assert all(j.get('notice_url')==j.get('apply_url') for j in rows), source_id
              assert all(path_fragment in str(j.get('apply_url') or '') for j in rows), (source_id,[j.get('apply_url') for j in rows[:5]])
              status_row=source_diag.get(source_id) or {}
              assert status_row.get('ok') and not status_row.get('preserved_previous'), (source_id,status_row)
              d=status_row.get('diagnostics') or {}
              assert d.get('transport')==transport and d.get('complete') is True, (source_id,d)
              assert int(d.get('unique_jobs') or 0)==len(rows), (source_id,d,len(rows))
              if observed=='official-public-api':
                  assert int(d.get('reported_total') or 0)==len(rows), (source_id,d)
              else:
                  assert float(d.get('coverage_ratio') or 0)>=0.995, (source_id,d)
                  assert int(d.get('pages_read') or 0)>=90, (source_id,d)
                  assert d.get('cookie_values_exported') is False, (source_id,d)
                  assert d.get('request_signature_reproduced') is False, (source_id,d)
              total += len(rows)
          assert int(diag.get('reviewed_api_sources') or 0) == 4, diag.get('reviewed_api_sources')
          assert int(diag.get('reviewed_api_fresh_jobs') or 0) >= 2800, diag.get('reviewed_api_fresh_jobs')
          assert total>=2800, total
          print('kuaishou reviewed catalogues:',[(source_id,len([j for j in jobs if j.get('source')=='direct-official:browser:'+source_id])) for source_id in specs])
          print('reviewed fresh:',diag.get('reviewed_api_fresh_jobs'),'combined=',total)
          PY

      - name: Rebuild graph with observed jobs and restore expanded nodes
        run: |
          PYTHONPATH=. python scripts/official_source_graph.py
          PYTHONPATH=. python scripts/recruit_domain_expander.py

      - name: Compact browser feeds
        run: PYTHONPATH=. python scripts/compact_feed.py

      - name: Validate sweep coverage and catalogue integrity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          catalog=json.loads(Path('data/recruit_domain_catalog.json').read_text(encoding='utf-8'))
          graph=json.loads(Path('data/official_source_catalog.json').read_text(encoding='utf-8'))
          status=json.loads(Path('data/source_status.json').read_text(encoding='utf-8'))
          jobs=json.loads(Path('data/jobs.json').read_text(encoding='utf-8'))
          cn=json.loads(Path('data/jobs_cn.json').read_text(encoding='utf-8'))
          assert catalog.get('version') == 1
          assert catalog.get('source_count',0) >= 700, catalog.get('source_count')
          assert catalog.get('sweepable_count',0) >= 650, catalog.get('sweepable_count')
          companies={x.get('company') for x in catalog.get('sources',[]) if isinstance(x,dict)}
          for company in ['快手','京东','百度','阿里巴巴','字节跳动','小红书','地平线','寒武纪','摩尔线程','沐曦']:
              assert company in companies, company
          assert graph.get('recruit_domain_promoted',0) >= 700
          groups={x.get('name'):x for x in status.get('sources',[]) if isinstance(x,dict)}
          sweep=groups.get('recruit-domain-sweep'); assert sweep is not None
          diag=sweep.get('diagnostics') or {}
          assert diag.get('catalog_total',0) >= 700
          assert catalog.get('source_count',0) >= diag.get('catalog_total',0)
          assert diag.get('selected_targets',0) >= 1
          assert jobs.get('schema_version') == 4 and cn.get('schema_version') == 4
          assert len(jobs.get('jobs',[])) >= 10000 and len(cn.get('jobs',[])) >= 1000
          if os.getenv('GITHUB_EVENT_NAME') == 'pull_request':
              selected={x.get('company') for x in diag.get('selected',[]) if isinstance(x,dict)}
              assert {'快手','京东'}.issubset(selected), selected
              srcs=[x for x in diag.get('sources',[]) if isinstance(x,dict)]
              ks=[x for x in srcs if x.get('company')=='快手']
              jd=[x for x in srcs if x.get('company')=='京东']
              assert len(ks)>=4 and sum(int(x.get('count') or 0) for x in ks)>=2800, ks
              assert all(x.get('ok') and not x.get('preserved_previous') for x in ks), ks
              assert jd and all(x.get('official_url') for x in jd), jd
              names='\n'.join((str(j.get('c',''))+' '+str(j.get('r',''))+' '+str(j.get('l',''))) for j in cn.get('jobs',[]))
              assert '快手' in names
              links=[str(j.get('u') or '') for j in cn.get('jobs',[]) if str(j.get('c') or '')=='快手']
              for fragment in ['/campus/job-info/','/official/social/job-info/','/official/trainee/job-info/']:
                  assert any(fragment in u for u in links), (fragment,links[:10])
          print('recruit domains:',catalog.get('source_count'),'sweepable=',catalog.get('sweepable_count'))
          print('shard:',diag.get('shard_index'),'/',diag.get('shard_count'),'selected=',diag.get('selected_targets'),'fresh=',sweep.get('fresh_count'))
          print('companies:',[(x.get('company'),x.get('count'),x.get('error')) for x in (diag.get('sources') or [])])
          PY
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Commit refreshed sweep data
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          TRACKED='data/jobs.json data/jobs_cn.json data/source_status.json data/official_source_catalog.json data/recruit_domain_catalog.json'
          if git diff --quiet -- $TRACKED; then
            echo 'No recruitment-domain changes.'
            exit 0
          fi
          git config user.name 'path-to-offer-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $TRACKED
          git commit -m 'data: sweep public recruitment domains'
          git pull --rebase origin main
          git push origin HEAD:main
