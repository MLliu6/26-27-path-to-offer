name: static-checks

on:
  push:
    paths-ignore:
      - 'data/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.4 playwright

      - name: Check JavaScript and Python syntax
        run: |
          for f in app.js config.js matching-core.js profile-core-v05.js enhancements-v04.js ranking-v06.js ranking-v07.js ranking-v09.js market-v06.js enhancements-v05.js enhancements-v06.js enhancements-v07.js enhancements-v09.js career-taxonomy-v13.js ranking-v13.js enhancements-v13.js ranking-v14.js enhancements-v14.js enhancements-v141.js score-explain-v14.js pipeline-timeline-v14.js; do node --check "$f"; done
          node tests/persona_trials.mjs
          node tests/profile_sections.mjs
          node tests/ranking_calibration.mjs
          node tests/general_matching_v13.mjs
          node tests/v14_score_calibration.mjs
          python -m py_compile \
            scripts/aggregate_jobs.py scripts/expand_feed.py scripts/merge_public_tables.py \
            scripts/federated_harvester.py scripts/direct_china_official.py scripts/priority_official_harvester.py \
            scripts/priority_browser_harvester.py scripts/priority_browser_runner.py scripts/priority_browser_runtime.py \
            scripts/official_site_job_spider.py scripts/official_campaign_discovery.py scripts/soe_directory_harvester.py \
            scripts/university_2027_discovery.py scripts/ncss_public_harvester.py scripts/compact_feed.py \
            scripts/user_target_overlay.py scripts/user_target_source_catalog.py \
            tests/browser_smoke.py tests/theme_smoke.py tests/large_catalog_smoke.py \
            tests/v14_source_resilience_smoke.py tests/v14_pipeline_timeline_smoke.py tests/v141_feed_recovery_smoke.py
          PYTHONPATH=. python -m unittest -v \
            tests.test_aggregate_jobs tests.test_public_tables tests.test_federated_harvester \
            tests.test_compact_feed tests.test_expand_feed tests.test_direct_china_official \
            tests.test_ncss_public_harvester tests.test_priority_browser_harvester \
            tests.test_priority_browser_runner tests.test_user_target_overlay

      - name: Check product invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          config=Path('config.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          core=Path('matching-core.js').read_text(encoding='utf-8')
          ranking=Path('ranking-v14.js').read_text(encoding='utf-8')
          enhancement=Path('enhancements-v14.js').read_text(encoding='utf-8')
          hotfix=Path('enhancements-v141.js').read_text(encoding='utf-8')
          browser_registry=Path('sources/priority_browser_sources.json').read_text(encoding='utf-8')
          priority_registry=Path('sources/priority_official_sources.json').read_text(encoding='utf-8')
          manifest=json.loads(Path('sources/user_target_positions_20260903.json').read_text(encoding='utf-8'))
          overlay=Path('scripts/user_target_overlay.py').read_text(encoding='utf-8')
          source_catalog=Path('scripts/user_target_source_catalog.py').read_text(encoding='utf-8')
          target_workflow=Path('.github/workflows/refresh-user-target-coverage.yml').read_text(encoding='utf-8')

          assert "version: '1.4.2'" in config
          assert "buildVersion: '1.4.2-target-coverage'" in config
          assert 'domesticJobsFeed' in config and 'priorityJobsFeed' in config and 'PTO_NATIVE_FETCH' in config
          assert config.index('ranking-v13.js') < config.index('ranking-v14.js') < config.index('market-v06.js')
          assert config.index('enhancements-v13.js') < config.index('enhancements-v14.js') < config.index('enhancements-v141.js')

          for token in ['resumeImport','jobMarketCards','githubLoginBtn','pipelineView','reviewImport']:
              assert f'id="{token}"' in html, token
          for token in ['extractResumeText','loadFeeds','promoteMarketJob','localStorage']:
              assert token in app, token
          for token in ['filterAndRank','searchMatch','directionScores','recommendedRoles','京东']:
              assert token in core, token
          for token in ['v14-fit-confidence-separated','evidenceConfidence','SEARCH_SCORE_LIMIT']:
              assert token in ranking, token
          for token in ['PTO_FEED_RUNTIME','部分信源降级','恢复全部']:
              assert token in enhancement, token
          for token in ['45000','catalogInconsistent','expectedCatalogCount','PTO_V141_FEED_READY']:
              assert token in hotfix, token

          for company in ['辉羲智能','银河通用','智元机器人','地平线','寒武纪','摩尔线程','沐曦','壁仞科技','智谱AI','中国联通']:
              assert company in browser_registry, company
          for company in ['中国石油','中国石化','中国工商银行','银河通用','辉羲智能','小鹏集团','中国银行']:
              assert company in priority_registry, company

          targets=[r for t in manifest.get('targets',[]) if isinstance(t,dict) for r in (t.get('roles') or []) if isinstance(r,dict)]
          companies={t.get('company') for t in manifest.get('targets',[]) if isinstance(t,dict)}
          assert len(companies) >= 45 and len(targets) >= 85
          ids={str(r.get('position_id') or '') for r in targets}
          for pid in ['JR2024107','7667126080873433397','199907640056','4531829293','7659673414492145946','7646709410002323731','2088167899066974208','7672029899397744902','10493864']:
              assert pid in ids, pid
          for token in ['curated-target:20260903','待官网实时复核','location_compatible','target_position_audit.json']:
              assert token in overlay, token
          for token in ['user-target-20260903','target_source_count','sweep_enabled']:
              assert token in source_catalog, token
          assert '17 * * * *' in target_workflow and 'user_target_overlay.py' in target_workflow
          print('Path to Offer v1.4.2 universal matching and target-coverage checks passed.')
          PY

      - name: Browser smoke tests
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/path-to-offer-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          python tests/browser_smoke.py
          python tests/theme_smoke.py
          python tests/large_catalog_smoke.py
