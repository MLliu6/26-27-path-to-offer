name: deep-source-probe-v151

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/deep_source_probe_v151.py'
      - '.github/workflows/deep-source-probe-v151.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright client
        run: python -m pip install --disable-pip-version-check playwright
      - name: Probe anonymous public recruiting traffic
        run: PYTHONPATH=. python tests/deep_source_probe_v151.py
