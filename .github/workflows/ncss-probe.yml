name: ncss-public-probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe_ncss.py'
      - '.github/workflows/ncss-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright library
        run: python -m pip install --disable-pip-version-check playwright
      - name: Observe public NCSS same-origin job-search requests
        run: python scripts/probe_ncss.py
