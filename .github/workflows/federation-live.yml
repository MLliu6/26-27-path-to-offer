name: live-federation-acceptance

on:
  pull_request:
    paths:
      - 'scripts/expand_feed.py'
      - 'scripts/federated_harvester.py'
      - 'scripts/direct_china_official.py'
      - 'scripts/priority_official_harvester.py'
      - 'scripts/official_campaign_discovery.py'
      - 'scripts/soe_directory_harvester.py'
      - 'scripts/university_2027_discovery.py'
      - 'scripts/ncss_public_harvester.py'
      - 'scripts/compact_feed.py'
      - 'ranking-v07.js'
      - 'ranking-v09.js'
      - 'enhancements-v07.js'
      - 'enhancements-v09.js'
      - 'market-v06.js'
      - 'sources/federated_sources.json'
      - 'sources/domestic_direct_sources.json'
      - 'sources/priority_official_sources.json'
      - 'sources/campus_discovery_sources.json'
      - '.github/workflows/federation-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      PTO_HIRING_RADAR_DIR: /tmp/hiring-radar
      PTO_HIRING_RADAR_COMMIT: f49ec607e4cb89091a9447c9f527e43d0afdc6a4
      PTO_FEDERATED_WORKERS: '16'
      PTO_CATALOG_JD_CHARS: '600'
      PTO_BROWSER_JD_CHARS: '220'
      PTO_MAX_CATALOG: '60000'
      PTO_MAX_CN_CATALOG: '30000'
      PTO_NCSS_MAX_EXPLICIT: '15000'
      PTO_NCSS_PRIORITY_COMPANIES: '80'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.4
      - name: Fetch pinned fallback adapter library
        run: |
          git clone --quiet --filter=blob:none https://github.com/simonlin1212/Hiring-Radar.git "$PTO_HIRING_RADAR_DIR"
          git -C "$PTO_HIRING_RADAR_DIR" checkout --quiet "$PTO_HIRING_RADAR_COMMIT"
          test "$(git -C "$PTO_HIRING_RADAR_DIR" rev-parse HEAD)" = "$PTO_HIRING_RADAR_COMMIT"
      - name: Run live nationwide China-first source stack
        run: |
          PYTHONPATH=. python scripts/expand_feed.py
          PYTHONPATH=. python scripts/federated_harvester.py
          PYTHONPATH=. python scripts/direct_china_official.py
          PYTHONPATH=. python scripts/merge_public_tables.py
          PYTHONPATH=. python scripts/priority_official_harvester.py
          PYTHONPATH=. python scripts/official_campaign_discovery.py
          PYTHONPATH=. python scripts/soe_directory_harvester.py
          PYTHONPATH=. python scripts/university_2027_discovery.py
          PYTHONPATH=. python scripts/ncss_public_harvester.py
          PYTHONPATH=. python scripts/compact_feed.py
      - name: Enforce nationwide 2027 acceptance gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gp=Path('data/jobs.json'); cp=Path('data/jobs_cn.json')
          feed=json.loads(gp.read_text(encoding='utf-8')); cn=json.loads(cp.read_text(encoding='utf-8')); status=json.loads(Path('data/source_status.json').read_text(encoding='utf-8'))
          jobs=feed.get('jobs',[]); cn_jobs=cn.get('jobs',[])
          print('LIVE_GLOBAL=',len(jobs),'GLOBAL_BYTES=',gp.stat().st_size,'LIVE_CN=',len(cn_jobs),'CN_BYTES=',cp.stat().st_size)
          assert feed.get('schema_version') == 4 and cn.get('schema_version') == 4
          assert len(jobs) >= 10000 and len(cn_jobs) >= 1000
          assert gp.stat().st_size < 40_000_000 and cp.stat().st_size < gp.stat().st_size
          names='\n'.join((j.get('c','')+' '+j.get('r','')+' '+j.get('l','')+' '+j.get('x','')) for j in cn_jobs).lower()
          for q in ['京东','腾讯','字节','北京','美团','航天科工','银河通用','中国银行','宇树','小鹏']:
              assert q.lower() in names, f'{q} missing from China-first feed'
          direct=next((s for s in status.get('sources',[]) if s.get('name')=='direct-china-official'),None); assert direct and direct.get('ok')
          companies={x.get('company'):x for x in (direct.get('diagnostics') or {}).get('sources',[])}
          assert companies.get('美团',{}).get('count',0)>=50 and companies.get('腾讯',{}).get('count',0)>=100
          priority=next((s for s in status.get('sources',[]) if s.get('name')=='priority-official-sources'),None); assert priority and priority.get('ok')
          pdiag=priority.get('diagnostics') or {}; adapters=pdiag.get('adapters') or []; assert pdiag.get('watch_total',0)>=50
          campaigns=lambda company:[x for x in adapters if x.get('company')==company and x.get('type')=='campaign']
          assert sum(x.get('count',0) for x in campaigns('航天科工集团'))>=9, campaigns('航天科工集团')
          assert sum(x.get('count',0) for x in campaigns('银河通用'))>=6, campaigns('银河通用')
          assert sum(x.get('count',0) for x in campaigns('宇树科技'))>=7, campaigns('宇树科技')
          assert sum(x.get('count',0) for x in campaigns('小鹏集团'))>=4, campaigns('小鹏集团')
          assert sum(x.get('count',0) for x in campaigns('中国银行'))>=3, campaigns('中国银行')
          campaign=next((s for s in status.get('sources',[]) if s.get('name')=='official-campaign-discovery'),None); assert campaign and (campaign.get('diagnostics') or {}).get('portals',0)>=50
          soe=next((s for s in status.get('sources',[]) if s.get('name')=='central-soe-official-directory'),None); assert soe is not None
          university=next((s for s in status.get('sources',[]) if s.get('name')=='university-2027-discovery'),None); assert university is not None
          ncss=next((s for s in status.get('sources',[]) if s.get('name')=='ncss-2027-public'),None); assert ncss and ncss.get('ok') and ncss.get('count',0)>=500, ncss
          ndiag=ncss.get('diagnostics') or {}; assert ndiag.get('beijing_technical_rows',0)>=20 and ndiag.get('state_owned_rows',0)>=10, ndiag
          meituan=[j for j in cn_jobs if '美团' in j.get('c','')]; mt_bj=[j for j in meituan if '北京' in j.get('l','')]
          tech=('大模型','算法','ai','推理','infra','研发','开发','技术','机器学习','多模态')
          mt_bj_tech=[j for j in mt_bj if any(t in (j.get('r','')+' '+j.get('d','')).lower() for t in tech)]; assert mt_bj and mt_bj_tech
          casic_bj=[j for j in cn_jobs if '航天科工' in j.get('c','') and '北京' in j.get('l','') and '2027' in (j.get('r','')+j.get('g','')+j.get('b',''))]
          galbot_rows=[j for j in cn_jobs if '银河通用' in j.get('c','') and '2027' in (j.get('g','')+j.get('b',''))]
          boc_rows=[j for j in cn_jobs if '中国银行' in j.get('c','') and '2027' in (j.get('g','')+j.get('b',''))]
          unitree_rows=[j for j in cn_jobs if '宇树' in j.get('c','') and '2027' in (j.get('g','')+j.get('b',''))]
          xpeng_rows=[j for j in cn_jobs if '小鹏' in j.get('c','') and '2027' in (j.get('g','')+j.get('b',''))]
          assert len(casic_bj)>=9 and len(galbot_rows)>=6 and len(boc_rows)>=3 and len(unitree_rows)>=7 and len(xpeng_rows)>=4
          obvious=['united states','germany','france','singapore','tokyo','india']; overseas=sum(1 for j in cn_jobs if any(x in str(j.get('l','')).lower() for x in obvious)); assert overseas <= max(10,len(cn_jobs)//200)
          print('DIRECT_COMPANIES=',[(k,v.get('count'),v.get('ok')) for k,v in companies.items()])
          print('PRIORITY_WATCH=',pdiag.get('watch_ok'),'/',pdiag.get('watch_total'),'root_2027=',pdiag.get('watch_2027'))
          print('PRIORITY_CAMPAIGNS=',[(x.get('company'),x.get('count'),x.get('ok')) for x in adapters if x.get('type')=='campaign'])
          print('NCSS=',ncss.get('count'),ndiag)
          print('UNIVERSITY=',university.get('count'),university.get('diagnostics'))
          print('SOE_DIRECTORY=',soe.get('count'),soe.get('diagnostics'))
          print('FINAL_KEY_ROWS=',{'CASIC_BJ':len(casic_bj),'GALBOT':len(galbot_rows),'BOC':len(boc_rows),'UNITREE':len(unitree_rows),'XPENG':len(xpeng_rows),'MEITUAN_BJ_TECH':len(mt_bj_tech),'OVERSEAS':overseas})
          PY
