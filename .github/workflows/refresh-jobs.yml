name: refresh-public-jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/expand_feed.py'
      - 'scripts/merge_public_tables.py'
      - 'scripts/federated_harvester.py'
      - 'scripts/moka_public_harvester.py'
      - 'scripts/direct_china_official.py'
      - 'scripts/pdd_official_harvester.py'
      - 'scripts/didi_official_harvester.py'
      - 'scripts/didi_browser_ui_harvester.py'
      - 'scripts/didi_ui_priority_seed.py'
      - 'scripts/priority_official_harvester.py'
      - 'scripts/priority_browser_harvester.py'
      - 'scripts/priority_browser_runner.py'
      - 'scripts/official_site_job_spider.py'
      - 'scripts/official_campaign_discovery.py'
      - 'scripts/official_source_graph.py'
      - 'scripts/official_source_sampler.py'
      - 'scripts/soe_directory_harvester.py'
      - 'scripts/university_2027_discovery.py'
      - 'scripts/ncss_public_harvester.py'
      - 'scripts/ncss_recent_all.py'
      - 'scripts/compact_feed.py'
      - 'sources/**'
      - '.github/workflows/refresh-jobs.yml'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-public-jobs
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 88
    continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
    env:
      PTO_HIRING_RADAR_DIR: /tmp/hiring-radar
      PTO_HIRING_RADAR_COMMIT: f49ec607e4cb89091a9447c9f527e43d0afdc6a4
      PTO_FEDERATED_WORKERS: '12'
      PTO_MOKA_WORKERS: '10'
      PTO_MOKA_MAX_PAGES: '20'
      PTO_CATALOG_JD_CHARS: '600'
      PTO_BROWSER_JD_CHARS: '220'
      PTO_MAX_CATALOG: '60000'
      PTO_MAX_CN_CATALOG: '30000'
      PTO_NCSS_MAX_EXPLICIT: '15000'
      PTO_NCSS_PRIORITY_COMPANIES: '100'
      PTO_NCSS_ALL_MAX_ROWS: '12000'
      PTO_OFFICIAL_SAMPLE_SITES: '30'
      PTO_OFFICIAL_PAGES_PER_SITE: '5'
      PTO_DIDI_MAX_PAGES: '80'
      PTO_DIDI_DETAIL_WORKERS: '12'
      PTO_DIDI_BROWSER_MAX_PAGES: '80'
      PTO_PRIORITY_BROWSER_TIMEOUT_MS: '26000'
      PTO_PRIORITY_BROWSER_JD_CHARS: '5000'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.4 playwright pycryptodome==3.23.0

      - name: Expand previous compact feed
        id: expand
        run: PYTHONPATH=. python scripts/expand_feed.py

      - name: Fetch pinned fallback adapter library
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          rm -rf "$PTO_HIRING_RADAR_DIR"
          git clone --quiet --filter=blob:none https://github.com/simonlin1212/Hiring-Radar.git "$PTO_HIRING_RADAR_DIR"
          git -C "$PTO_HIRING_RADAR_DIR" checkout --quiet "$PTO_HIRING_RADAR_COMMIT"
          test "$(git -C "$PTO_HIRING_RADAR_DIR" rev-parse HEAD)" = "$PTO_HIRING_RADAR_COMMIT"

      - name: Federated public ATS sources
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/federated_harvester.py

      - name: Public Moka employer federation
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/moka_public_harvester.py

      - name: Direct China employer APIs
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/direct_china_official.py

      - name: PDD first-party positions
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/pdd_official_harvester.py

      - name: DiDi first-party browser fallback
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          PYTHONPATH=. python scripts/didi_official_harvester.py || true
          PYTHONPATH=. python scripts/didi_browser_ui_harvester.py

      - name: Merge reviewed public tables
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/merge_public_tables.py

      - name: Priority official pages and campaigns
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/priority_official_harvester.py

      - name: Employer-owned bounded site spider
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/official_site_job_spider.py

      - name: Priority employer real-browser ATS observation
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/priority_browser_runner.py

      - name: Official campaign discovery
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/official_campaign_discovery.py

      - name: Central SOE official directory
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/soe_directory_harvester.py

      - name: University 2027 discovery
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/university_2027_discovery.py

      - name: NCSS targeted 2027 discovery
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/ncss_public_harvester.py

      - name: NCSS recent all discovery
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/ncss_recent_all.py

      - name: Rebuild official source graph
        run: PYTHONPATH=. python scripts/official_source_graph.py

      - name: Rotate official-source sampler
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: PYTHONPATH=. python scripts/official_source_sampler.py

      - name: Compact browser feeds
        id: compact
        run: PYTHONPATH=. python scripts/compact_feed.py

      - name: Validate catalogue output and first-party gates
        id: validation
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json,re
          from datetime import date
          from pathlib import Path
          global_path=Path('data/jobs.json'); cn_path=Path('data/jobs_cn.json')
          graph_path=Path('data/official_source_catalog.json')
          feed=json.loads(global_path.read_text(encoding='utf-8'))
          cn=json.loads(cn_path.read_text(encoding='utf-8'))
          status=json.loads(Path('data/source_status.json').read_text(encoding='utf-8'))
          graph=json.loads(graph_path.read_text(encoding='utf-8'))
          jobs=feed.get('jobs',[]); cn_jobs=cn.get('jobs',[])
          assert feed.get('schema_version') == 4 and cn.get('schema_version') == 4
          assert len(jobs) >= 10_000 and len(cn_jobs) >= 1_000
          assert all(j.get('c') and j.get('r') for j in cn_jobs)
          assert status.get('cn_catalog_count') == len(cn_jobs)
          assert global_path.stat().st_size < 45_000_000 and cn_path.stat().st_size < global_path.stat().st_size
          names='\n'.join((j.get('c','')+' '+j.get('r','')+' '+j.get('l','')+' '+j.get('x','')) for j in cn_jobs).lower()
          for query in ['京东','腾讯','字节','北京','美团','拼多多','滴滴','Shopee','航天科工','银河通用','中国银行']:
              assert query.lower() in names.lower(), f'{query} missing from China-first feed'
          by_name={s.get('name'):s for s in status.get('sources',[]) if isinstance(s,dict)}
          moka=by_name.get('moka-public-federation'); assert moka and moka.get('ok') and moka.get('count',0)>=1, moka
          mdiag=moka.get('diagnostics') or {}; assert mdiag.get('companies_ok',0)>=1, mdiag
          shopee_rows=[j for j in cn_jobs if ('shopee' in str(j.get('c','')).lower() or '虾皮' in str(j.get('c','')))]
          assert shopee_rows, 'Shopee missing from public Moka federation'
          if date(2026,7,28)<=date.today()<=date(2026,11,30):
              campus=[j for j in shopee_rows if '2027' in str(j.get('g',''))+str(j.get('b',''))+str(j.get('r','')) or '27届' in str(j.get('r',''))+str(j.get('b',''))]
              assert campus, 'Shopee current 2027 campus rows missing'
              ai_bj=[j for j in campus if '北京' in str(j.get('l','')) and re.search(r'AI\s*(?:基础设施|基础架构|训练\s*/?\s*推理)',str(j.get('r','')),re.I)]
              assert ai_bj, {'message':'Shopee Beijing AI infrastructure/training-inference family missing','sample':[j.get('r') for j in campus[:20]]}
          direct=by_name.get('direct-china-official'); assert direct and direct.get('ok')
          direct_companies={x.get('company'):x for x in (direct.get('diagnostics') or {}).get('sources',[])}
          assert direct_companies.get('美团',{}).get('count',0)>=50
          assert direct_companies.get('腾讯',{}).get('count',0)>=100
          pdd=by_name.get('pdd-direct-official'); assert pdd and pdd.get('count',0)>=20
          assert (pdd.get('diagnostics') or {}).get('seed_gate_ok') is True
          didi=by_name.get('didi-direct-official'); assert didi and didi.get('ok') and didi.get('count',0)>=16, didi
          assert (didi.get('diagnostics') or {}).get('transport') == 'browser-ui-navigation', didi
          pid='5e4eb6f3-294f-491b-9d39-42895eed98c3'
          exact=[j for j in cn_jobs if j.get('r')=='AI Infra研发工程师' and pid in (j.get('u','')+j.get('n',''))]
          assert exact, 'exact PDD AI Infra position missing'
          priority=by_name.get('priority-official-sources'); assert priority and priority.get('ok')
          pdiag=priority.get('diagnostics') or {}; adapters=pdiag.get('adapters') or []
          assert pdiag.get('watch_total',0)>=50
          campaigns=lambda company:[x for x in adapters if x.get('company')==company and x.get('type')=='campaign']
          assert sum(x.get('count',0) for x in campaigns('航天科工集团'))>=9
          assert sum(x.get('count',0) for x in campaigns('银河通用'))>=6
          assert sum(x.get('count',0) for x in campaigns('中国银行'))>=3
          browser_group=by_name.get('priority-browser-official'); assert browser_group is not None
          bdiag=browser_group.get('diagnostics') or {}; assert bdiag.get('target_count',0)>=15, bdiag
          browser_companies={x.get('company') for x in bdiag.get('sources',[]) if isinstance(x,dict) and x.get('company')}
          required_browser={'辉羲智能','银河通用','智元机器人','地平线','寒武纪','摩尔线程','沐曦','壁仞科技','智谱AI','月之暗面','MiniMax','阶跃星辰','燧原科技','宇树科技','昆仑芯'}
          assert required_browser.issubset(browser_companies), required_browser-browser_companies
          ncss=by_name.get('ncss-2027-public'); assert ncss and ncss.get('ok') and ncss.get('count',0)>=500
          graph_group=by_name.get('official-source-graph'); assert graph_group is not None
          assert graph.get('version') == 2, graph.get('version')
          assert graph.get('observed_job_board_normalization') is True
          assert graph.get('source_count',0)>=100, graph.get('source_count')
          graph_companies={x.get('company') for x in graph.get('sources',[])}
          for company in ['滴滴','辉羲智能','银河通用','地平线','宁德时代']:
              assert company in graph_companies, company
          overseas=sum(1 for j in cn_jobs if any(x in str(j.get('l','')).lower() for x in ['united states','germany','france','singapore','tokyo','india']))
          assert overseas <= max(10, len(cn_jobs)//200)
          print('global:',len(jobs),global_path.stat().st_size)
          print('china:',len(cn_jobs),cn_path.stat().st_size,'overseas=',overseas)
          print('Moka:',moka.get('count'),'companies_ok=',mdiag.get('companies_ok'),'Shopee=',len(shopee_rows))
          print('PDD exact:',exact[0].get('u'))
          print('DiDi:',didi.get('count'),(didi.get('diagnostics') or {}).get('batches'))
          print('priority browser:',browser_group.get('count'),bdiag.get('fresh_companies'),[(x.get('company'),x.get('count'),x.get('preserved_previous')) for x in bdiag.get('sources',[])])
          print('official graph:',graph.get('source_count'),graph_group.get('diagnostics'))
          PY

      - name: Commit refreshed feed when changed
        if: ${{ always() && steps.compact.outcome == 'success' && (github.event_name != 'workflow_dispatch' || steps.validation.outcome == 'success') }}
        run: |
          TRACKED='data/jobs.json data/jobs_cn.json data/source_status.json data/official_source_catalog.json'
          if git diff --quiet -- $TRACKED; then
            echo 'No feed changes.'
            exit 0
          fi
          git config user.name 'path-to-offer-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $TRACKED
          git commit -m 'data: refresh nationwide employer-source graph'
          git pull --rebase origin main
          git push origin HEAD:main
