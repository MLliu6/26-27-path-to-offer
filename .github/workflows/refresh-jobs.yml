name: refresh-public-jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/expand_feed.py'
      - 'scripts/china_official_campus.py'
      - 'scripts/compact_feed.py'
      - 'sources/**'
      - '.github/workflows/refresh-jobs.yml'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-public-jobs
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      PTO_JOBPRO_BIN: job-pro
      PTO_JOBPRO_VERSION: '1.2.1'
      PTO_JOBPRO_WORKERS: '6'
      PTO_JOBPRO_TIMEOUT: '75'
      PTO_JOBPRO_MAX_PAGES: '60'
      PTO_CHINA_MAX_CATALOG: '25000'
      PTO_BROWSER_JD_CHARS: '300'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned campus adapter library
        run: |
          npm install --global --no-audit --no-fund @ha7ch/job-pro@1.2.1
          test "$(job-pro --version)" = "1.2.1"
      - name: Build employer-official campus catalogue
        run: |
          # Restore only the prior v0.7 transport so failed company sources can
          # retain their last proven campus snapshot. Legacy global/social rows
          # are rejected by china_official_campus.py.
          PYTHONPATH=. python scripts/expand_feed.py
          # Every fresh command is job-pro <company> all --scope campus. No
          # Liepin fallback, international-only board or social scope is used.
          PYTHONPATH=. python scripts/china_official_campus.py
          PYTHONPATH=. python scripts/compact_feed.py
      - name: Validate campus-official catalogue output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/jobs.json')
          feed=json.loads(path.read_text(encoding='utf-8'))
          status=json.loads(Path('data/source_status.json').read_text(encoding='utf-8'))
          jobs=feed.get('jobs',[])
          focus=status.get('china_focus') or {}
          size=path.stat().st_size
          assert feed.get('schema_version') == 4
          assert status.get('catalog_mode') == 'china-campus-official'
          assert (status.get('adapter_library') or {}).get('version') == '1.2.1'
          assert isinstance(jobs,list) and all(j.get('c') and j.get('r') for j in jobs)
          assert status.get('catalog_count') == len(jobs)
          assert 1_000 <= len(jobs) <= 25_000, f'campus catalogue size outside safety band: {len(jobs)}'
          assert int(focus.get('company_official_count') or 0) == len(jobs), focus
          assert int(focus.get('campus_proven_count') or 0) == len(jobs), focus
          assert int(focus.get('foreign_count') or 0) == 0, focus
          assert int(focus.get('beijing_count') or 0) >= 100, focus
          assert int(focus.get('companies_in_catalog') or 0) >= 10, focus
          assert float(focus.get('direct_link_ratio') or 0) >= 0.95, focus
          assert size < 20_000_000, f'campus browser feed too large: {size}'
          names='\n'.join((j.get('c','')+' '+j.get('r','')) for j in jobs).lower()
          for q in ['京东','腾讯','字节','百度']:
              assert q.lower() in names, f'missing official campus company: {q}'
          print('catalogue rows:',len(jobs),'bytes:',size,'schema:',feed.get('schema_version'))
          print('china focus:',focus)
          print('adapter:',status.get('adapter_library'))
          print('source diagnostics:',(status.get('sources') or [{}])[0].get('diagnostics'))
          PY
      - name: Commit refreshed feed when changed
        run: |
          if git diff --quiet -- data/jobs.json data/source_status.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "path-to-offer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/source_status.json
          git commit -m "data: refresh employer campus-official jobs"
          git push origin HEAD:main
