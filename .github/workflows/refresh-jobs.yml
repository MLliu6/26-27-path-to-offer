name: refresh-public-jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/merge_public_tables.py'
      - 'scripts/federated_harvester.py'
      - 'scripts/compact_feed.py'
      - 'sources/**'
      - '.github/workflows/refresh-jobs.yml'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-public-jobs
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      PTO_HIRING_RADAR_DIR: /tmp/hiring-radar
      PTO_HIRING_RADAR_COMMIT: f49ec607e4cb89091a9447c9f527e43d0afdc6a4
      PTO_FEDERATED_WORKERS: '12'
      PTO_CATALOG_JD_CHARS: '600'
      PTO_BROWSER_JD_CHARS: '360'
      PTO_MAX_CATALOG: '60000'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.4
      - name: Fetch pinned MIT public ATS adapters
        run: |
          rm -rf "$PTO_HIRING_RADAR_DIR"
          git clone --quiet --filter=blob:none https://github.com/simonlin1212/Hiring-Radar.git "$PTO_HIRING_RADAR_DIR"
          git -C "$PTO_HIRING_RADAR_DIR" checkout --quiet "$PTO_HIRING_RADAR_COMMIT"
          test "$(git -C "$PTO_HIRING_RADAR_DIR" rev-parse HEAD)" = "$PTO_HIRING_RADAR_COMMIT"
      - name: Aggregate public official sources
        run: |
          # Public campus/state tables provide a small China/央国企 supplement.
          PYTHONPATH=. python scripts/merge_public_tables.py
          # The primary catalogue comes from official China sources + official ATS boards.
          PYTHONPATH=. python scripts/federated_harvester.py
          # Convert verbose crawler records to the compact browser transport schema.
          PYTHONPATH=. python scripts/compact_feed.py
      - name: Validate catalogue output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/jobs.json')
          feed=json.loads(path.read_text(encoding='utf-8'))
          status=json.loads(Path('data/source_status.json').read_text(encoding='utf-8'))
          jobs=feed.get('jobs',[])
          size=path.stat().st_size
          assert feed.get('schema_version') == 4
          assert isinstance(jobs,list)
          assert status.get('catalog_count') == len(jobs)
          assert all(j.get('c') and j.get('r') for j in jobs)
          assert size < 35_000_000, f'compact catalogue exceeds browser budget: {size}'
          print('catalogue rows:',len(jobs),'bytes:',size,'schema:',feed.get('schema_version'))
          print('federated counts:',[(s.get('name'),s.get('count')) for s in status.get('sources',[]) if s.get('name') in {'china-official-federation','official-ats-discovery','public-remote-boards'}])
          PY
      - name: Commit refreshed feed when changed
        run: |
          if git diff --quiet -- data/jobs.json data/source_status.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "path-to-offer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/source_status.json
          git commit -m "data: refresh compact federated jobs"
          git push origin HEAD:main
