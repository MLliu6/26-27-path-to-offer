name: refresh-public-jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/aggregate_jobs.py'
      - 'scripts/render_offerjack.py'
      - 'sources/**'
      - '.github/workflows/refresh-jobs.yml'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-public-jobs
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.4 playwright
      - name: Aggregate public job sources
        run: |
          python scripts/aggregate_jobs.py
          PYTHONPATH=. python scripts/render_offerjack.py
      - name: Commit refreshed feed when changed
        run: |
          if git diff --quiet -- data/jobs.json data/source_status.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "path-to-offer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/source_status.json
          git commit -m "data: refresh public jobs"
          git push origin HEAD:main
