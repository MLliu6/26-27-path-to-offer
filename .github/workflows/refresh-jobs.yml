name: refresh-public-jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/expand_feed.py'
      - 'scripts/merge_public_tables.py'
      - 'scripts/federated_harvester.py'
      - 'scripts/direct_china_official.py'
      - 'scripts/priority_official_harvester.py'
      - 'scripts/official_site_job_spider.py'
      - 'scripts/official_campaign_discovery.py'
      - 'scripts/soe_directory_harvester.py'
      - 'scripts/university_2027_discovery.py'
      - 'scripts/ncss_public_harvester.py'
      - 'scripts/ncss_recent_all.py'
      - 'scripts/compact_feed.py'
      - 'sources/**'
      - '.github/workflows/refresh-jobs.yml'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-public-jobs
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      PTO_HIRING_RADAR_DIR: /tmp/hiring-radar
      PTO_HIRING_RADAR_COMMIT: f49ec607e4cb89091a9447c9f527e43d0afdc6a4
      PTO_FEDERATED_WORKERS: '12'
      PTO_CATALOG_JD_CHARS: '600'
      PTO_BROWSER_JD_CHARS: '220'
      PTO_MAX_CATALOG: '60000'
      PTO_MAX_CN_CATALOG: '30000'
      PTO_NCSS_MAX_EXPLICIT: '15000'
      PTO_NCSS_PRIORITY_COMPANIES: '80'
      PTO_NCSS_ALL_MAX_ROWS: '12000'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.4
      - name: Fetch pinned fallback adapter library
        run: |
          rm -rf "$PTO_HIRING_RADAR_DIR"
          git clone --quiet --filter=blob:none https://github.com/simonlin1212/Hiring-Radar.git "$PTO_HIRING_RADAR_DIR"
          git -C "$PTO_HIRING_RADAR_DIR" checkout --quiet "$PTO_HIRING_RADAR_COMMIT"
          test "$(git -C "$PTO_HIRING_RADAR_DIR" rev-parse HEAD)" = "$PTO_HIRING_RADAR_COMMIT"
      - name: Aggregate public and employer-official sources
        run: |
          PYTHONPATH=. python scripts/expand_feed.py
          PYTHONPATH=. python scripts/federated_harvester.py
          PYTHONPATH=. python scripts/direct_china_official.py
          PYTHONPATH=. python scripts/merge_public_tables.py
          PYTHONPATH=. python scripts/priority_official_harvester.py
          PYTHONPATH=. python scripts/official_site_job_spider.py
          PYTHONPATH=. python scripts/official_campaign_discovery.py
          PYTHONPATH=. python scripts/soe_directory_harvester.py
          PYTHONPATH=. python scripts/university_2027_discovery.py
          PYTHONPATH=. python scripts/ncss_public_harvester.py
          PYTHONPATH=. python scripts/ncss_recent_all.py
          PYTHONPATH=. python scripts/compact_feed.py
      - name: Validate catalogue output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          global_path=Path('data/jobs.json'); cn_path=Path('data/jobs_cn.json')
          feed=json.loads(global_path.read_text(encoding='utf-8')); cn=json.loads(cn_path.read_text(encoding='utf-8'))
          status=json.loads(Path('data/source_status.json').read_text(encoding='utf-8'))
          jobs=feed.get('jobs',[]); cn_jobs=cn.get('jobs',[])
          assert feed.get('schema_version') == 4 and cn.get('schema_version') == 4
          assert len(jobs) >= 10_000 and len(cn_jobs) >= 1_000
          assert all(j.get('c') and j.get('r') for j in cn_jobs)
          assert status.get('cn_catalog_count') == len(cn_jobs)
          assert global_path.stat().st_size < 40_000_000 and cn_path.stat().st_size < global_path.stat().st_size
          names='\n'.join((j.get('c','')+' '+j.get('r','')+' '+j.get('l','')+' '+j.get('x','')) for j in cn_jobs).lower()
          for q in ['京东','腾讯','字节','北京','美团','航天科工','银河通用','中国银行']:
              assert q.lower() in names, f'{q} missing from China-first product feed'
          direct=next((s for s in status.get('sources',[]) if s.get('name')=='direct-china-official'),None); assert direct and direct.get('ok')
          direct_companies={x.get('company'):x for x in (direct.get('diagnostics') or {}).get('sources',[])}
          assert direct_companies.get('美团',{}).get('count',0)>=50 and direct_companies.get('腾讯',{}).get('count',0)>=100
          priority=next((s for s in status.get('sources',[]) if s.get('name')=='priority-official-sources'),None); assert priority and priority.get('ok')
          pdiag=priority.get('diagnostics') or {}; adapters=pdiag.get('adapters') or []; assert pdiag.get('watch_total',0)>=50
          campaigns=lambda company:[x for x in adapters if x.get('company')==company and x.get('type')=='campaign']
          assert sum(x.get('count',0) for x in campaigns('航天科工集团'))>=9
          assert sum(x.get('count',0) for x in campaigns('银河通用'))>=6
          assert sum(x.get('count',0) for x in campaigns('宇树科技'))>=7
          assert sum(x.get('count',0) for x in campaigns('小鹏集团'))>=4
          assert sum(x.get('count',0) for x in campaigns('中国银行'))>=3
          site_spider=next((s for s in status.get('sources',[]) if s.get('name')=='employer-site-job-spider'),None); assert site_spider is not None
          campaign=next((s for s in status.get('sources',[]) if s.get('name')=='official-campaign-discovery'),None); assert campaign and (campaign.get('diagnostics') or {}).get('portals',0)>=50
          soe=next((s for s in status.get('sources',[]) if s.get('name')=='central-soe-official-directory'),None); assert soe is not None
          university=next((s for s in status.get('sources',[]) if s.get('name')=='university-2027-discovery'),None); assert university is not None
          ncss=next((s for s in status.get('sources',[]) if s.get('name')=='ncss-2027-public'),None); assert ncss and ncss.get('ok') and ncss.get('count',0)>=500, ncss
          ndiag=ncss.get('diagnostics') or {}; assert ndiag.get('beijing_technical_rows',0)>=8 and ndiag.get('state_owned_rows',0)>=10, ndiag
          ncss_all=next((s for s in status.get('sources',[]) if s.get('name')=='ncss-current-all'),None); assert ncss_all and ncss_all.get('ok') and ncss_all.get('count',0)>=100, ncss_all
          casic_bj=[j for j in cn_jobs if '航天科工' in j.get('c','') and '北京' in j.get('l','') and '2027' in (j.get('r','')+j.get('g','')+j.get('b',''))]
          galbot_rows=[j for j in cn_jobs if '银河通用' in j.get('c','') and '2027' in (j.get('g','')+j.get('b',''))]
          boc_rows=[j for j in cn_jobs if '中国银行' in j.get('c','') and '2027' in (j.get('g','')+j.get('b',''))]
          unitree_rows=[j for j in cn_jobs if '宇树' in j.get('c','') and '2027' in (j.get('g','')+j.get('b',''))]
          xpeng_rows=[j for j in cn_jobs if '小鹏' in j.get('c','') and '2027' in (j.get('g','')+j.get('b',''))]
          assert len(casic_bj)>=9 and len(galbot_rows)>=6 and len(boc_rows)>=3 and len(unitree_rows)>=7 and len(xpeng_rows)>=4
          overseas=sum(1 for j in cn_jobs if any(x in str(j.get('l','')).lower() for x in ['united states','germany','france','singapore','tokyo','india']))
          assert overseas <= max(10, len(cn_jobs)//200)
          print('global rows/bytes:',len(jobs),global_path.stat().st_size)
          print('china rows/bytes:',len(cn_jobs),cn_path.stat().st_size,'overseas=',overseas)
          print('direct official:',[(k,v.get('count'),v.get('ok')) for k,v in direct_companies.items()])
          print('priority watch:',pdiag.get('watch_ok'),'/',pdiag.get('watch_total'),'root_2027=',pdiag.get('watch_2027'))
          print('site spider:',site_spider.get('count'),site_spider.get('diagnostics'))
          print('NCSS targeted:',ncss.get('count'),ndiag)
          print('NCSS all:',ncss_all.get('count'),ncss_all.get('diagnostics'))
          print('university:',university.get('count'),university.get('diagnostics'))
          PY
      - name: Commit refreshed feed when changed
        run: |
          if git diff --quiet -- data/jobs.json data/jobs_cn.json data/source_status.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "path-to-offer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/jobs_cn.json data/source_status.json
          git commit -m "data: refresh nationwide 2027 China campus sources"
          git push origin HEAD:main
