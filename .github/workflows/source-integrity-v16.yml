name: verify-official-source-directory
on:
  workflow_dispatch:
  schedule:
    - cron: '11 1 * * *'
  push:
    branches: [main]
    paths:
      - 'sources/sector_sources_v16.json'
      - 'scripts/source_integrity_audit.py'
      - '.github/workflows/source-integrity-v16.yml'
permissions:
  contents: write
concurrency:
  group: source-integrity-v16
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.13.4 pycryptodome==3.23.0
      - name: Test source evidence and lifecycle
        run: |
          python -m unittest discover -s tests -p 'test_source_integrity_v16.py'
          python -m unittest discover -s tests -p 'test_compact_feed.py'
          python -m unittest discover -s tests -p 'test_expand_feed.py'
      - name: Inspect official portals and concrete positions
        run: PYTHONPATH=. python scripts/source_integrity_audit.py --check-links
      - name: Publish public source evidence
        run: |
          git config user.name 'path-to-offer-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source_integrity_audit.json data/jobs_verified_v16.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: verify official directory and position lifecycle'
          git pull --rebase origin main
          git push origin HEAD:main
