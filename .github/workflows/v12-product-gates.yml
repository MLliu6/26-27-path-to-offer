name: v1.2-product-gates

on:
  pull_request:
    paths:
      - 'config.js'
      - 'enhancements-v12.js'
      - 'backend/**'
      - 'docs/PRIVACY_ACCOUNTS_AND_SYNC.md'
      - 'tests/privacy_account_admin_smoke.py'
      - '.github/workflows/v12-product-gates.yml'
  push:
    branches: [main]
    paths:
      - 'config.js'
      - 'enhancements-v12.js'
      - 'backend/**'
      - 'docs/PRIVACY_ACCOUNTS_AND_SYNC.md'
      - 'tests/privacy_account_admin_smoke.py'
      - '.github/workflows/v12-product-gates.yml'

permissions:
  contents: read

concurrency:
  group: v12-product-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check playwright
      - name: Syntax and privacy invariants
        run: |
          node --check config.js
          node --check enhancements-v12.js
          node --check backend/cloudflare-worker.js
          python -m py_compile tests/privacy_account_admin_smoke.py
          python - <<'PY'
          from pathlib import Path
          config=Path('config.js').read_text(encoding='utf-8')
          js=Path('enhancements-v12.js').read_text(encoding='utf-8')
          docs=Path('docs/PRIVACY_ACCOUNTS_AND_SYNC.md').read_text(encoding='utf-8')
          worker=Path('backend/cloudflare-worker.js').read_text(encoding='utf-8')
          for token in ['enhancements-v12.js','syncApiBase','syncRawResumeText','sourceAdminToken']:
              assert token in config, token
          for token in ['PBKDF2','AES-GCM','310000','导出匿名解析诊断','pto-admin-fog','companyInitial','pto.vault.v1.']:
              assert token in js, token
          for forbidden in ['github.com/repos/MLliu6/26-27-path-to-offer/contents','api.github.com/repos/MLliu6/26-27-path-to-offer/contents','git commit resume']:
              assert forbidden not in js.lower(), forbidden
          assert 'Git history' in docs or 'Git 提交历史' in docs
          assert 'PTO_VAULTS' in worker and 'X-PTO-Auth' in worker and 'MAX_BYTES' in worker
          print('v1.2 privacy/account/admin invariants: PASS')
          PY
      - name: Browser journey
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/pto-v12-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          python tests/privacy_account_admin_smoke.py
