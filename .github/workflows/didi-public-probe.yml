name: didi-public-recruiting-probe

on:
  push:
    branches: [agent/local-vault-admin-source-v1.2]
    paths:
      - 'scripts/probe_didi_official.py'
      - '.github/workflows/didi-public-probe.yml'
  pull_request:
    paths:
      - 'scripts/probe_didi_official.py'
      - '.github/workflows/didi-public-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright
      - name: Observe DiDi anonymous public recruiting calls
        run: python scripts/probe_didi_official.py
