name: huawei-v2-production-check

on:
  pull_request:
    paths:
      - 'scripts/huawei_v2_official_harvester.py'
      - 'scripts/priority_direct_feed.py'
      - '.github/workflows/huawei-v2-production-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-public-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 playwright
      - name: Verify Huawei current public graduate API
        run: |
          PYTHONPATH=. python - <<'PY'
          from scripts.huawei_v2_official_harvester import collect_huawei
          jobs, d = collect_huawei()
          assert d['total_reported'] >= 60, d
          assert d['total_pages'] >= 6, d
          assert len(jobs) >= 60, d
          ai = [j for j in jobs if j.get('role') == 'AI Infra工程师']
          assert ai, [j.get('role') for j in jobs[:30]]
          assert '北京' in ai[0].get('location',''), ai[0]
          assert ai[0].get('position_id') == '103891', ai[0]
          assert any('ICT BG' in j.get('department','') for j in ai), ai
          assert all(j.get('source') == 'direct-official:huawei-v2' for j in jobs)
          assert d.get('transport') in {'browser-page-public-api','http-public-api'}, d
          print('Huawei live:', d)
          print('AI Infra:', ai[0])
          PY
      - name: Verify priority compact encoding
        run: |
          PYTHONPATH=. python - <<'PY'
          from scripts.huawei_v2_official_harvester import normalize_huawei_job
          from scripts.priority_direct_feed import encode
          job = normalize_huawei_job({
              'jobId': 103891,
              'jobName': 'AI Infra工程师',
              'workPlace': '苏州/杭州/北京/深圳',
              'deptName': 'ICT BG,2012实验室,云计算BU',
              'categoryName': '研发类',
              'lastUpdateDate': '2026-08-17',
              'scenarioName': '应届生',
          })
          row = encode(job)
          assert row.get('c') == '华为'
          assert row.get('r') == 'AI Infra工程师'
          assert row.get('z') == '103891'
          assert row.get('s') == 'direct-official:huawei-v2'
          assert '北京' in row.get('l','')
          assert row.get('g') == '2027届'
          print('Huawei compact exact:', row)
          PY
