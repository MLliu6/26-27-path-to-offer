name: refresh-priority-official-jobs

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/pdd_official_harvester.py'
      - 'scripts/priority_direct_feed.py'
      - 'scripts/direct_china_official.py'
      - 'sources/official_position_seeds.json'
      - 'sources/domestic_direct_sources.json'
      - 'enhancements-v11.js'
      - 'config.js'
      - '.github/workflows/refresh-priority-official.yml'
  pull_request:
    paths:
      - 'scripts/pdd_official_harvester.py'
      - 'scripts/priority_direct_feed.py'
      - 'scripts/direct_china_official.py'
      - 'sources/official_position_seeds.json'
      - 'sources/domestic_direct_sources.json'
      - 'enhancements-v11.js'
      - 'config.js'
      - 'tests/test_pdd_official_harvester.py'
      - 'tests/priority_feed_browser_smoke.py'
      - '.github/workflows/refresh-priority-official.yml'

permissions:
  contents: write

concurrency:
  group: priority-official-feed-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  refresh-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Scheduled upstream failures are best-effort and must not generate recurring
    # failure mail. Pull requests and manual runs remain strict for release gates.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 playwright
      - name: Unit-test the exact PDD adapter
        run: PYTHONPATH=. python -m unittest -v tests.test_pdd_official_harvester
      - name: Collect priority employer-owned sources
        run: PYTHONPATH=. python scripts/priority_direct_feed.py
      - name: Enforce exact PDD position and category breadth
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pid='5e4eb6f3-294f-491b-9d39-42895eed98c3'
          feed=json.loads(Path('data/jobs_priority.json').read_text(encoding='utf-8'))
          status=json.loads(Path('data/priority_source_status.json').read_text(encoding='utf-8'))
          jobs=feed.get('jobs',[])
          exact=[j for j in jobs if pid in str(j.get('z',''))+str(j.get('u',''))+str(j.get('n',''))]
          assert exact, 'exact PDD position UUID missing'
          assert exact[0].get('r') == 'AI Infra研发工程师', exact[0]
          assert 'positionId='+pid in exact[0].get('u','')
          assert exact[0].get('q') == 7 and exact[0].get('s') == 'direct-official:pdd'
          assert status.get('exact_pdd_position_ok') is True, status
          pdd=next((s for s in status.get('sources',[]) if s.get('name')=='pdd-direct-official'),None)
          assert pdd and pdd.get('count',0)>=20, pdd
          categories=dict((pdd.get('diagnostics') or {}).get('categories') or [])
          for category in ['技术','产品','职能']:
              assert category in categories, categories
          print('exact PDD:', exact[0].get('r'), exact[0].get('u'))
          print('PDD rows/categories:', pdd.get('count'), categories)
          PY
      - name: Browser-test priority feed merge and official apply link
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/pto-priority-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          python tests/priority_feed_browser_smoke.py
      - name: Commit refreshed priority feed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/jobs_priority.json data/priority_source_status.json; then
            echo 'No priority-feed changes.'
            exit 0
          fi
          git config user.name 'path-to-offer-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs_priority.json data/priority_source_status.json
          git commit -m 'data: refresh priority employer-direct jobs'
          git pull --rebase origin main
          git push origin HEAD:main
