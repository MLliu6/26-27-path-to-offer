# v1.2.4 production priority-feed trigger
name: refresh-priority-official-jobs

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/pdd_official_harvester.py'
      - 'scripts/didi_official_harvester.py'
      - 'scripts/didi_browser_ui_harvester.py'
      - 'scripts/didi_ui_priority_seed.py'
      - 'scripts/priority_direct_feed.py'
      - 'scripts/direct_china_official.py'
      - 'sources/official_position_seeds.json'
      - 'sources/domestic_direct_sources.json'
      - '.github/workflows/refresh-priority-official.yml'
  pull_request:
    paths:
      - 'scripts/pdd_official_harvester.py'
      - 'scripts/didi_official_harvester.py'
      - 'scripts/didi_browser_ui_harvester.py'
      - 'scripts/didi_ui_priority_seed.py'
      - 'scripts/priority_direct_feed.py'
      - 'scripts/direct_china_official.py'
      - 'sources/official_position_seeds.json'
      - 'sources/domestic_direct_sources.json'
      - 'tests/test_pdd_official_harvester.py'
      - 'tests/test_didi_official_harvester.py'
      - 'tests/test_didi_ui_priority_seed.py'
      - 'tests/priority_feed_browser_smoke.py'
      - '.github/workflows/refresh-priority-official.yml'

permissions:
  contents: write

concurrency:
  group: priority-official-feed-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  refresh-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    # Scheduled refreshes and main-branch source updates can encounter upstream
    # rate limits or transient employer outages. PR/manual validation remains strict.
    continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
    env:
      PTO_DIDI_MAX_PAGES: '80'
      PTO_DIDI_DETAIL_WORKERS: '16'
      PTO_DIDI_BROWSER_MAX_PAGES: '80'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.4 playwright

      - name: Unit-test employer adapters
        id: unit
        continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
        run: PYTHONPATH=. python -m unittest -v tests.test_pdd_official_harvester tests.test_didi_official_harvester tests.test_didi_ui_priority_seed

      - name: Collect fast direct sources
        id: fast
        continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
        run: PYTHONPATH=. python scripts/priority_direct_feed.py

      # If DiDi is transiently unavailable, priority_direct_feed.py has already
      # carried forward the previous validated DiDi rows. Do not discard fresh
      # PDD/Meituan/Tencent data merely because this browser pass timed out.
      - name: Repair DiDi through employer public UI navigation
        id: didi
        continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
        run: PYTHONPATH=. python scripts/didi_ui_priority_seed.py

      - name: Enforce PDD and DiDi first-party gates
        id: gates
        continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pid='5e4eb6f3-294f-491b-9d39-42895eed98c3'
          feed=json.loads(Path('data/jobs_priority.json').read_text(encoding='utf-8'))
          status=json.loads(Path('data/priority_source_status.json').read_text(encoding='utf-8'))
          jobs=feed.get('jobs',[])
          exact=[j for j in jobs if pid in str(j.get('z',''))+str(j.get('u',''))+str(j.get('n',''))]
          assert exact and exact[0].get('r') == 'AI Infra研发工程师', exact
          assert 'positionId='+pid in exact[0].get('u','')
          assert exact[0].get('q') == 7 and exact[0].get('s') == 'direct-official:pdd'
          sources={s.get('name'):s for s in status.get('sources',[]) if isinstance(s,dict)}
          pdd=sources.get('pdd-direct-official'); assert pdd and pdd.get('count',0)>=20, pdd
          didi=sources.get('didi-direct-official'); assert didi and didi.get('ok') and didi.get('count',0)>=16, didi
          assert (didi.get('diagnostics') or {}).get('transport') == 'browser-ui-navigation', didi
          didi_rows=[j for j in jobs if j.get('s')=='direct-official:didi']
          assert len(didi_rows)>=16 and all(j.get('u','').startswith('https://talent.didiglobal.com/') for j in didi_rows)
          didi_social=[j for j in didi_rows if ('社会' in str(j.get('b','')) or '社招' in str(j.get('b','')) or '/social/' in str(j.get('u','') or j.get('n','')).lower())]
          fresh_count=int(didi.get('fresh_count') or 0)
          assert fresh_count>=16, didi
          assert len(didi_social)==fresh_count, {'social_rows':len(didi_social),'fresh_count':fresh_count,'didi':didi}
          categories=dict((pdd.get('diagnostics') or {}).get('categories') or [])
          for category in ['技术','产品','职能']:
              assert category in categories, categories
          print('PDD:',pdd.get('count'),categories)
          print('DiDi UI:',didi.get('count'),(didi.get('diagnostics') or {}).get('batches'),'social=',len(didi_social),'fresh=',fresh_count)
          PY

      - name: Browser-test priority feed merge and official apply link
        id: browser
        continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/pto-priority-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          python tests/priority_feed_browser_smoke.py

      # Automatic runs commit whichever validated/carry-forward catalogue was
      # successfully produced. Manual dispatch commits only when strict gates and
      # the browser regression both pass. Pull requests never write data.
      - name: Commit refreshed priority feed
        if: ${{ always() && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || (steps.fast.outcome == 'success' && steps.gates.outcome == 'success' && steps.browser.outcome == 'success')) }}
        run: |
          if git diff --quiet -- data/jobs_priority.json data/priority_source_status.json; then
            echo 'No priority-feed changes.'
            exit 0
          fi
          git config user.name 'path-to-offer-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs_priority.json data/priority_source_status.json
          git commit -m 'data: refresh priority employer-direct jobs'
          git pull --rebase origin main
          git push origin HEAD:main
