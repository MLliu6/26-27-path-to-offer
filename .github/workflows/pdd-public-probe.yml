name: pdd-public-campus-probe

on:
  push:
    branches: [agent/source-federation-scoring-v1.0]
    paths:
      - 'scripts/probe_pdd_official.py'
      - '.github/workflows/pdd-public-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright
      - name: Observe PDD anonymous public recruiting calls
        run: python scripts/probe_pdd_official.py
