name: emergency-account-safety-v152

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-account-safety-v152.yml'

permissions:
  contents: write

concurrency:
  group: emergency-account-safety-v152
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Patch account separation and recovery entry
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('enhancements-v12-security.js')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing patch anchor: {label}')
              if s.count(old) != 1:
                  raise SystemExit(f'non-unique patch anchor: {label} ({s.count(old)})')
              s = s.replace(old, new, 1)

          replace_once(
              "  let persistChain=Promise.resolve(), pendingWrites=0;\n",
              "  let persistChain=Promise.resolve(), pendingWrites=0;\n"
              "  const ADMIN_PROOF_KEY='pto.source-admin-until.v2';\n"
              "  const ADMIN_PROOF_TTL=20*60*1000;\n",
              'admin proof constants'
          )

          replace_once(
              "  const remoteContext=spec=>`github:${spec.owner.toLowerCase()}/${spec.repo.toLowerCase()}/${spec.id}`;\n",
              "  const remoteContext=spec=>`github:${spec.owner.toLowerCase()}/${spec.repo.toLowerCase()}/${spec.id}`;\n"
              "  const isReservedAdminTarget=spec=>spec.username===ADMIN_ACCOUNT&&String(spec.owner).toLowerCase()===APP_OWNER.toLowerCase()&&String(spec.repo).toLowerCase()===APP_REPO.toLowerCase();\n"
              "  async function guardLocalVaultBeforeRemoteActivation(spec,password){\n"
              "    const raw=localStorage.getItem(localKey(spec.id));\n"
              "    if(!raw)return;\n"
              "    try{await VAULT.decryptJson(JSON.parse(raw),password,`local:${spec.id}`);}\n"
              "    catch(_){throw new Error('此设备已有由另一密码保护的本机账户。为防止覆盖，跨设备读取已被阻止；请打开“数据恢复”。');}\n"
              "  }\n",
              'remote safety helpers'
          )

          replace_once(
              "    const spec=await accountSpec(username,owner,repo);\n"
              "    if(!token||token.length<20)throw new Error('首次初始化需要仅授权该仓库 Contents 读写的 Fine-grained Token');\n",
              "    const spec=await accountSpec(username,owner,repo);\n"
              "    if(isReservedAdminTarget(spec))throw new Error('主仓库中的该路径仅用于信源管理员验证，不是个人求职账户；请使用本机账户或独立私有仓库。');\n"
              "    if(!token||token.length<20)throw new Error('首次初始化需要仅授权该仓库 Contents 读写的 Fine-grained Token');\n",
              'block reserved remote initialize'
          )

          replace_once(
              "    const payload=await VAULT.decryptJson(remote.vault,password,remoteContext(spec));\n"
              "    if(VAULT.normalizeAccount(payload.username)!==spec.username)throw new Error('账户校验失败');\n"
              "    const localToken=token||payload.writeToken||'';\n"
              "    if(activateAccount){\n"
              "      activate(payload,{...spec,mode:'github',password,token:localToken,remoteSha:remote.sha,remoteUpdatedAt:payload.updatedAt,remoteVerified:true,includeResumeText:!!payload.includeResumeText,portableWrite:!!payload.portableWrite});\n",
              "    const payload=await VAULT.decryptJson(remote.vault,password,remoteContext(spec));\n"
              "    if(VAULT.normalizeAccount(payload.username)!==spec.username)throw new Error('账户校验失败');\n"
              "    if(activateAccount&&isReservedAdminTarget(spec))throw new Error('该远端文件是信源管理员凭据，不是个人求职账户；已阻止覆盖本机数据。');\n"
              "    const localToken=token||payload.writeToken||'';\n"
              "    if(activateAccount){\n"
              "      await guardLocalVaultBeforeRemoteActivation(spec,password);\n"
              "      activate(payload,{...spec,mode:'github',password,token:localToken,remoteSha:remote.sha,remoteUpdatedAt:payload.updatedAt,remoteVerified:true,includeResumeText:!!payload.includeResumeText,portableWrite:!!payload.portableWrite});\n",
              'guard remote activation'
          )

          replace_once(
              "  function openSecureAccountModal(){openModal('账户、隐私与同步',accountHtml());bindAccountActions();}\n",
              "  function openSecureAccountModal(){\n"
              "    openModal('账户、隐私与同步',accountHtml());bindAccountActions();\n"
              "    const grid=$('.account-grid');\n"
              "    if(grid&&!$('#ptoRecoveryBanner'))grid.insertAdjacentHTML('beforebegin','<div id=\"ptoRecoveryBanner\" class=\"vault-security-note\"><strong>账户或记录异常？</strong> 不要覆盖账户。先打开 <a href=\"./recovery.html\">本机数据恢复</a>，检查主密文、自动快照和旧版缓存。</div>');\n"
              "  }\n"
              "  function installRecoveryEntry(){\n"
              "    if($('#ptoRecoveryTop'))return;\n"
              "    const anchor=$('#addJobBtn');if(!anchor)return;\n"
              "    const link=document.createElement('a');link.id='ptoRecoveryTop';link.className='btn ghost';link.href='./recovery.html';link.textContent='数据恢复';link.title='检查本机加密快照与旧版缓存';anchor.parentNode.insertBefore(link,anchor);\n"
              "  }\n",
              'recovery entry'
          )

          replace_once(
              "  function adminVerified(){return !!(adminUnlocked&&session?.username===ADMIN_ACCOUNT&&session?.remoteVerified&&String(session.owner).toLowerCase()===APP_OWNER.toLowerCase()&&String(session.repo).toLowerCase()===APP_REPO.toLowerCase());}\n",
              "  function adminVerified(){return Number(sessionStorage.getItem(ADMIN_PROOF_KEY)||0)>Date.now();}\n",
              'independent admin proof'
          )

          replace_once(
              "        await unlockRemote({username:ADMIN_ACCOUNT,password:value('#secureAdminPass'),owner:APP_OWNER,repo:APP_REPO,token:value('#secureAdminToken')},{activateAccount:true});\n"
              "        adminUnlocked=true;closeModal();showAdminSources();\n",
              "        const proof=await unlockRemote({username:ADMIN_ACCOUNT,password:value('#secureAdminPass'),owner:APP_OWNER,repo:APP_REPO,token:value('#secureAdminToken')},{activateAccount:false});\n"
              "        if(VAULT.normalizeAccount(proof.payload.username)!==ADMIN_ACCOUNT)throw new Error('管理员账户校验失败');\n"
              "        sessionStorage.setItem(ADMIN_PROOF_KEY,String(Date.now()+ADMIN_PROOF_TTL));\n"
              "        adminUnlocked=true;closeModal();showAdminSources();\n",
              'non-destructive admin verification'
          )

          replace_once(
              "  injectSecurityStyles();\n"
              "  setAccountButton();\n",
              "  injectSecurityStyles();\n"
              "  setAccountButton();\n"
              "  installRecoveryEntry();\n",
              'install top recovery link'
          )

          if 'activateAccount:false' not in s or 'ADMIN_PROOF_KEY' not in s or './recovery.html' not in s:
              raise SystemExit('account-safety invariants missing after patch')
          p.write_text(s,encoding='utf-8')

          config=Path('config.js')
          c=config.read_text(encoding='utf-8')
          c=c.replace("version: '1.5.1'","version: '1.5.2'",1)
          c=c.replace("buildVersion: '1.5.1-theme-source-sync'","buildVersion: '1.5.2-account-recovery'",1)
          config.write_text(c,encoding='utf-8')

          index=Path('index.html')
          h=index.read_text(encoding='utf-8').replace('?v=1.5.1','?v=1.5.2')
          index.write_text(h,encoding='utf-8')

          sec=p.read_text(encoding='utf-8')
          assert "unlockRemote({username:ADMIN_ACCOUNT" in sec
          admin_block=sec.split("$('#secureAdminUnlock')",1)[1].split("});",1)[0]
          assert "activateAccount:false" in admin_block
          assert "activateAccount:true" not in admin_block
          assert "guardLocalVaultBeforeRemoteActivation" in sec
          assert "isReservedAdminTarget" in sec
          assert "./recovery.html" in sec
          assert "version: '1.5.2'" in config.read_text(encoding='utf-8')
          assert "buildVersion: '1.5.2-account-recovery'" in config.read_text(encoding='utf-8')
          assert '?v=1.5.2' in index.read_text(encoding='utf-8')
          print('v1.5.2 account separation and recovery patch PASS')
          PY

      - name: JavaScript syntax checks
        run: |
          node --check enhancements-v12-security.js
          node --check config.js
          python - <<'PY'
          from pathlib import Path
          html=Path('recovery.html').read_text(encoding='utf-8')
          assert 'pto.secure.snapshots.v15.' in html
          assert 'pto.recovery.quarantine.v1.' in html
          assert 'crypto.subtle.decrypt' in html
          assert 'localStorage.clear' not in html
          js=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/recovery-v152.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/recovery-v152.js

      - name: Commit directly to main
        run: |
          git config user.name 'path-to-offer-recovery-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/emergency-account-safety-v152.yml
          git add enhancements-v12-security.js config.js index.html recovery.html .github/workflows/emergency-account-safety-v152.yml
          git commit -m 'v1.5.2: separate admin proof and add local recovery'
          git pull --rebase origin main
          git push origin HEAD:main
