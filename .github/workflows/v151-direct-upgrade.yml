name: v151-direct-upgrade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v151_direct_upgrade.py'
      - 'scripts/v151_hotfix.py'
      - 'scripts/v151_theme_diag.py'
      - '.github/workflows/v151-direct-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v151-direct-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install UI and crawler dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.4 playwright pycryptodome==3.23.0
      - name: Apply v1.5.1 UI and source patch
        run: |
          python scripts/v151_direct_upgrade.py
          python scripts/v151_hotfix.py
      - name: Syntax and account-preservation checks
        run: |
          node --check app.js
          node --check enhancements-v06.js
          node --check enhancements-v13.js
          node --check workspace-v15.js
          node --check config.js
          node tests/account_vault.mjs
          node tests/account_vault_security.mjs
          python -m py_compile scripts/workspace_source_refresh.py tests/theme_smoke.py scripts/v151_theme_diag.py
          if grep -R "localStorage.clear" -n workspace-v15.js enhancements-v06.js enhancements-v13.js scripts/v151_direct_upgrade.py scripts/v151_hotfix.py; then exit 1; fi
      - name: Theme and workspace browser regression
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/pto-v151-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 1
          python scripts/v151_theme_diag.py
          python tests/theme_smoke.py
          python tests/workspace_v15_smoke.py
      - name: Deep refresh all reviewed supplemental sources
        env:
          PTO_V15_FULL: '1'
        run: PYTHONPATH=. python scripts/workspace_source_refresh.py
      - name: Validate named source coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/supplemental_source_status.json').read_text(encoding='utf-8'))
          rows={x.get('id'):x for x in s.get('sources',[]) if isinstance(x,dict)}
          required=['supplemental-xiaomi','supplemental-xiaomi-campus','supplemental-cmb-campus-mobile','supplemental-state-grid','supplemental-reviewed-spacechina-iguopin']
          for k in required: assert k in rows,k
          assert rows['supplemental-xiaomi'].get('count',0)>0,rows['supplemental-xiaomi']
          assert rows['supplemental-reviewed-spacechina-iguopin'].get('count',0)>0,rows['supplemental-reviewed-spacechina-iguopin']
          print(json.dumps({k:{'ok':rows[k].get('ok'),'count':rows[k].get('count'),'error':rows[k].get('error')} for k in required},ensure_ascii=False,indent=2))
          PY
      - name: Commit v1.5.1 directly to main
        run: |
          git config user.name 'path-to-offer-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/v151_direct_upgrade.py scripts/v151_hotfix.py scripts/v151_theme_diag.py .github/workflows/v151-direct-upgrade.yml
          git add -A
          git commit -m 'v1.5.1: restore accent themes and deepen official source sync'
          git pull --rebase origin main
          git push origin HEAD:main
