name: energy-recruiting-public-probe

on:
  pull_request:
    paths:
      - 'scripts/probe_energy_portals.py'
      - '.github/workflows/energy-portal-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright
      - name: Observe public recruiting network calls
        run: python scripts/probe_energy_portals.py
